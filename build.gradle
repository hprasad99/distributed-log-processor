plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id "com.diffplug.spotless" version "6.25.0" apply false
    id 'checkstyle'
    id 'jacoco'
}

allprojects {
    group = 'com.example'
    version = '0.0.1-SNAPSHOT'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testCompileOnly 'org.projectlombok:lombok'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testAnnotationProcessor 'org.projectlombok:lombok'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-kafka'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
        // Source: https://mvnrepository.com/artifact/org.springframework/spring-beans
        implementation("org.springframework:spring-beans:7.0.7")
        // Source: https://mvnrepository.com/artifact/io.micrometer/micrometer-registry-prometheus
        implementation("io.micrometer:micrometer-registry-prometheus:1.17.0-M3")
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    spotless {
        java {
            target 'src/*/java/**/*.java'
            googleJavaFormat('1.17.0') // Uses Google Java Format
            removeUnusedImports()
            importOrder('java', 'javax', 'org', 'com', '')
            indentWithSpaces(4)
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
}